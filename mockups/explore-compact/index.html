<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explorează — schiță compactă</title><style>body{margin:0;background:#f7f8f2;color:#243a30;font:16px/1.6 system-ui,sans-serif}header{max-width:1120px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 6px}p{margin:8px 0}nav{display:flex;gap:12px;flex-wrap:wrap}a{color:#204c3c;text-underline-offset:4px}main{padding:0 16px 30px}img{display:block;margin:20px auto;max-width:100%;height:auto;border:1px solid #dfe3d8;border-radius:8px}button,select{padding:10px 14px;font:inherit;border:1px solid #cbd4c3;background:#fffefa;color:#243a30;border-radius:7px;cursor:pointer}button[aria-pressed=true]{background:#204c3c;color:#fffefa}#image{width:1440px}label{display:flex;gap:10px;align-items:center}:focus-visible{outline:3px solid #c7522d;outline-offset:3px}</style><header><h1>Explorează, direct la întrebare</h1><p>Schiță vizuală pe interfața existentă. Controalele din captură nu sunt interactive; aplicația nu a fost modificată.</p><nav aria-label="Compară variantele"><button aria-pressed="true" data-state="proposal">Propunere</button><button aria-pressed="false" data-state="before">Înainte</button><label>Ecran<select id="device"><option value="desktop">Desktop</option><option value="mobile">Mobil</option><option value="mobile-dark">Mobil · dark</option></select></label></nav><p id="measure">Desktop: prima alegere la 282px, răspunsul la 528px.</p></header><main><img id="image" src="proposal-desktop.png" alt="Schița compactă a paginii Explorează"></main><script>let state='proposal';const select=document.querySelector('select'),img=document.querySelector('img');function render(){const device=select.value;const shown=state==='before'&&device==='mobile-dark'?'mobile':device;img.src=state+'-'+shown+'.png';img.style.width=device==='desktop'?'1440px':'390px';img.alt=(state==='proposal'?'Propunere compactă':'Interfața actuală')+' — '+shown;document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));document.querySelector('#measure').textContent=device==='desktop'?(state==='proposal'?'Desktop: prima alegere la 282px, răspunsul la 528px.':'Desktop: prima alegere la 598px, răspunsul la 989px.'):(state==='proposal'?'Mobil: prima alegere la 339px, răspunsul la 744px.':'Mobil: prima alegere la 712px, răspunsul la 1151px.');}document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;render()});select.onchange=render;</script></html>
