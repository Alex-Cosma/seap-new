<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27/%3E"><title>Document demonstrativ · cinecâștigă?</title><link rel="stylesheet" href="../src/fonts.css"><link rel="stylesheet" href="style.css"></head><body><main class="document-page" id="document"></main><script type="module">
import {stories} from './data.js';
const q=new URLSearchParams(location.search),s=stories.find(s=>s.id===q.get('story')),i=Number(q.get('source'));
const money=n=>new Intl.NumberFormat('ro-RO',{minimumFractionDigits:2}).format(n)+' lei';
if(!s||!Number.isInteger(i)||i<0||i>4){document.querySelector('main').innerHTML='<h1>Document indisponibil</h1><p>Linkul nu corespunde unei surse din machetă.</p><a href="./">Înapoi la povești</a>';}
else document.querySelector('main').innerHTML=`<a class="brand" href="./">cine<em>câștigă</em><b>?</b></a><p class="demo-note">Document demonstrativ. Nu reprezintă o achiziție, un articol de presă sau o constatare reală.</p><h1>${i<3?s.labels[i]:i===3?'Articol de context — exemplu':'Notă de documentare — exemplu'}</h1>${i<3?`<table class="document-table"><tbody><tr><th>Referință</th><td>DEMO-${i+1}</td></tr><tr><th>Data înregistrării</th><td>${s.days[i]}</td></tr><tr><th>Valoare înregistrată</th><td>${money(s.values[i])}</td></tr><tr><th>Instituție fictivă</th><td>${s.authorities?.[i]||s.authority}</td></tr><tr><th>Furnizor fictiv</th><td>${s.supplier}</td></tr></tbody></table><p>În aplicație, această acțiune va deschide pagina reală a achiziției, cu referința SEAP și documentele disponibile.</p>`:i===3?'<p>O sursă de presă poate aduce informații despre execuția lucrărilor, declarații sau fotografii de la fața locului. În povestea publicată ar exista autorul, publicația, data și linkul către articolul original.</p><p>Acesta este un exemplu local care demonstrează deschiderea sursei într-un tab separat. Nu există un articol real citat.</p>':'<p>Selecția conține exact cele trei înregistrări fictive din cronologie. Valorile sunt adunate fără a le interpreta ca plăți.</p><p>O documentare publicată trebuie să păstreze criteriile selecției și referințele surselor. Orice interpretare trebuie separată de informația verificată.</p>'}<p><b>Limitele exemplului</b><br>${s.unknown}</p><a class="text-link" href="./#/poveste/${s.id}">Înapoi la poveste</a>`;
</script></body></html>
